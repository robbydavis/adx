<!DOCTYPE html>
<html lang="en" class="theme-fcma">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons — Almanac DX UI Kit</title>
  <link rel="stylesheet" href="https://use.typekit.net/ort7knu.css">
  <link rel="stylesheet" href="src/tokens/styles/tokens.css">
  <link rel="stylesheet" href="src/tokens/styles/layout.css">
  <link rel="stylesheet" href="src/tokens/styles/button.css">
  <link rel="stylesheet" href="src/tokens/styles/text-input.css">
  <link rel="stylesheet" href="src/tokens/styles/select.css">
  <link rel="stylesheet" href="src/tokens/styles/side-nav.css">
  <link rel="stylesheet" href="adx.css">
</head>
<body>

  <div class="adx-layout">

    <!-- Top Bar -->
    <nav class="adx-topbar">
      <button class="adx-mobile-nav-trigger" onclick="toggleMobileNav()">Menu</button>
      <span class="topbar-title">Almanac DX UI Kit</span>
      <div class="theme-switcher">
        <button class="theme-btn active" onclick="setTheme('fcma')" id="btn-fcma">FCMA</button>
        <button class="theme-btn" onclick="setTheme('rural-first')" id="btn-rural">Rural 1st</button>
      </div>
    </nav>

    <!-- Wrapper: Nav + Content -->
    <div class="adx-wrapper">

      <!-- Side Navigation (rendered by nav.js) -->
      <nav class="adx-side-nav adx-side-nav--open" id="side-nav"></nav>

      <!-- Main + Footer wrapper -->
      <div class="adx-main-wrapper">

        <!-- Main Content -->
        <main class="adx-main">

          <section class="adx-section" id="buttons">
            <div class="adx-content-m">
              <div class="section-inner">
                <h2 class="section-title">Button Components</h2>
                <p class="section-subtitle">Buttons matching Figma spec — sizes, types, icon variants, and states.</p>

                <div class="type-label">Primary — Sizes</div>
                <div class="component-row">
                  <button class="adx-btn adx-btn--primary adx-btn--large">Large</button>
                  <button class="adx-btn adx-btn--primary adx-btn--medium">Medium</button>
                  <button class="adx-btn adx-btn--primary adx-btn--small">Small</button>
                  <button class="adx-btn adx-btn--primary adx-btn--xsmall">XSmall</button>
                </div>

                <div class="type-label">Secondary — Sizes</div>
                <div class="component-row">
                  <button class="adx-btn adx-btn--secondary adx-btn--large">Large</button>
                  <button class="adx-btn adx-btn--secondary adx-btn--medium">Medium</button>
                  <button class="adx-btn adx-btn--secondary adx-btn--small">Small</button>
                  <button class="adx-btn adx-btn--secondary adx-btn--xsmall">XSmall</button>
                </div>

                <div class="type-label">Icon Buttons</div>
                <div class="component-row">
                  <button class="adx-btn adx-btn--icon" aria-label="Menu">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M3 5h14v2H3V5zm0 4h14v2H3V9zm0 4h14v2H3v-2z"/></svg>
                  </button>
                  <button class="adx-btn adx-btn--icon" aria-label="Search">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="2" fill="none"/><line x1="12" y1="12" x2="17" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  </button>
                  <button class="adx-btn adx-btn--icon-brand" aria-label="Add">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M9 3v6H3v2h6v6h2v-6h6V9h-6V3H9z"/></svg>
                  </button>
                </div>

                <div class="type-label">States</div>
                <div class="component-row">
                  <button class="adx-btn adx-btn--primary adx-btn--medium">Default</button>
                  <button class="adx-btn adx-btn--primary adx-btn--medium" disabled>Disabled</button>
                  <button class="adx-btn adx-btn--primary adx-btn--medium adx-btn--loading">Loading...</button>
                  <button class="adx-btn adx-btn--secondary adx-btn--medium" disabled>Disabled</button>
                  <button class="adx-btn adx-btn--secondary adx-btn--medium adx-btn--loading">Loading...</button>
                </div>
              </div>
            </div>
          </section>

        </main>

        <!-- Footer -->
        <footer class="adx-footer">
          <section class="adx-section">
            <div class="adx-content-l">
              <p class="footer-text">
                Almanac DX UI Kit v0.1.0
              </p>
            </div>
          </section>
        </footer>

      </div><!-- /adx-main-wrapper -->

    </div><!-- /adx-wrapper -->

  </div><!-- /adx-layout -->

  <script src="nav.js"></script>

</body>
</html>
